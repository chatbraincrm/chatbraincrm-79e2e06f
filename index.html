<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- SEO -->
    <title>ChatBrain CRM | CRM com IA para vendas e atendimento</title>
    <meta name="description" content="Centralize atendimentos, oportunidades e automações em um CRM com IA para vender mais, responder rápido e organizar sua operação." />
    <meta name="author" content="ChatBrain CRM" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3B82F6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChatBrain CRM" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-128x128.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts — Outfit (carregamento antecipado) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ChatBrain CRM | CRM com IA para vendas e atendimento" />
    <meta property="og:description" content="Centralize atendimentos, oportunidades e automações em um CRM com IA para vender mais, responder rápido e organizar sua operação." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@chatbraincrm" />
    <meta name="twitter:title" content="ChatBrain CRM | CRM com IA para vendas e atendimento" />
    <meta name="twitter:description" content="Centralize atendimentos, oportunidades e automações em um CRM com IA para vender mais, responder rápido e organizar sua operação." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Boot styles: previne flash branco antes do React montar -->
    <style>
      html, body {
        background: #0B0F1F;
        color: #F5F7FA;
        margin: 0;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        font-family: 'Outfit', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #root { min-height: 100vh; }
      #boot-loader {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #0B0F1F;
        z-index: 9999;
      }
      #boot-loader .spinner {
        width: 36px; height: 36px;
        border: 3px solid rgba(59, 130, 246, 0.18);
        border-top-color: #3B82F6;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      .app-mounted #boot-loader { display: none; }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="boot-loader"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
